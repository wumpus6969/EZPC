name: Resolve Images

on:
  schedule:
    - cron: "42 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve broken product images
        run: node scripts/resolve-images.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images.json
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "chore: auto-resolve product images"
            git push
          fi
