<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EZPC Product</title>
    <meta name="description" content="Detailed PC part page with product info, retailer prices, and product photos." />
    <script>
      (() => {
        try {
          document.documentElement.dataset.theme = localStorage.getItem("ezpc-theme") || "light";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html#home" aria-label="EZPC home">
        <span class="brand-mark">EZ</span>
        <span>EZPC</span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html#categories">Categories</a>
        <a href="index.html#deals">Deals</a>
        <a href="index.html#builder">Builder</a>
        <a href="index.html#catalog">Parts</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" data-theme-toggle>
        <span class="theme-option theme-option-sun" aria-hidden="true">
          <span class="sun-icon"></span>
        </span>
        <span class="theme-option theme-option-moon" aria-hidden="true">
          <span class="moon-icon"></span>
        </span>
      </button>
    </header>

    <main class="product-page">
      <section class="product-detail" id="productDetail" aria-live="polite"></section>
    </main>

    <footer class="footer">
      <span>EZPC Parts Market</span>
      <span>Product pages show verified retailer offers and product media as the catalog is expanded.</span>
    </footer>

    <script src="product-images.js"></script>
    <script src="script.js"></script>
  </body>
</html>
